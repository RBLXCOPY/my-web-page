<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Copier Tool</title>

<style>
  /* VIDEO BACKGROUND */
  .video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
  }

  .video-bg iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* OVERLAY POUR LECTURE DU TEXTE */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: -1;
  }

  body {
    color: #f8fafc;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    padding-bottom: 50px;
  }

  /* HEADER SÉCURITÉ */
  .security-header {
    margin-top: 40px;
    text-align: center;
  }

  .security-header h1 {
    font-size: 42px;
    font-weight: bold;
    margin: 0;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 8px rgba(255,255,255,0.4); }
    to { text-shadow: 0 0 20px rgba(255,255,255,0.9); }
  }

  .security-bar {
    margin: 15px auto 0;
    width: 320px;
    height: 6px;
    background: rgba(255,255,255,0.3);
    border-radius: 6px;
    overflow: hidden;
  }

  .security-bar-fill {
    height: 100%;
    width: 0%;
    background: white;
    animation: fillBar 2s ease-out forwards;
  }

  @keyframes fillBar {
    from { width: 0%; }
    to { width: 100%; }
  }

  /* BOUTON YOUTUBE */
  .yt-button {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 10;
    overflow: hidden;
  }

  .yt-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .box {
    background: rgba(0,0,0,0.75);
    padding: 40px;
    border-radius: 16px;
    width: 450px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    margin-top: 60px;
  }

  textarea {
    width: 100%;
    height: 120px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-family: monospace;
    resize: none;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: gray;
    color: white;
    font-weight: bold;
    cursor: not-allowed;
    margin-bottom: 10px;
  }

  button.enabled {
    background: #22c55e;
    cursor: pointer;
  }

  .tutorial-title {
    margin: 40px 0 15px;
    font-weight: bold;
    font-size: 20px;
  }

  .video-container {
    width: 560px;
    max-width: 90%;
    height: 315px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .modal-content {
    background: #444;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    min-width: 300px;
  }

  .loader {
    border: 6px solid #eee;
    border-top: 6px solid #22c55e;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<div class="video-bg">
  <iframe
    src="https://gold-thunders.tiiny.site"
    allow="autoplay; fullscreen"
  ></iframe>
</div>
<div class="overlay"></div>

<div class="security-header">
  <h1>100% SECURE</h1>
  <div class="security-bar">
    <div class="security-bar-fill"></div>
  </div>
</div>

<a class="yt-button"
   href="https://www.youtube.com/@AndroidOwnedScripterOwner"
   target="_blank">
  <img src="https://cdn.discordapp.com/attachments/1456286084777377864/1457083009122435163/minia_youtube.jpg">
</a>

<div class="box">
  <h2>Roblox Game Copier</h2>
  <p>Submit the game file to unlock the Download</p>

  <textarea id="input" placeholder="Paste here..."></textarea>
  <button id="submit" disabled>Submit script</button>
  <button id="download" disabled>Download file</button>
</div>

<div class="tutorial-title">TUTORIAL</div>

<div class="video-container" id="videoContainer">
  <img
    src="https://cdn.discordapp.com/attachments/1456286084777377864/1457068308217069759/thumbnail_so_FIRE.jpg"
    style="width:100%; height:100%; cursor:pointer; object-fit:cover;"
    id="videoThumbnail">
</div>

</body>
</html>
